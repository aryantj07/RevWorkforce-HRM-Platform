apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: revworkforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: docker-eureka-server
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-server:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: revworkforce
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8761
      targetPort: 8761
