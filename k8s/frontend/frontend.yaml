apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: revworkforce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: GATEWAY_BASE_URL
              value: http://api-gateway:8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: revworkforce
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30090
